                <input type="number" name="qtd" id="qtd">
                <input type="text" name="comprador" id="comprador">

                <input type="button" value="Adicionar" id="but-add-venda" onclick="add_venda()">
                <div id="update-delete-venda">
                    <input type="button" value="Alterar" onclick="upt_venda()">
