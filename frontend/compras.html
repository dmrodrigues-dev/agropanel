<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras - Agropanel</title>
    <script src="/frontend/javascript/config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>

<body>
    <header>
        <h1>AGROPANEL</h1>
        <nav>
            <ul>
                <li><a href="./index.html">Página Inicial</a></li>
                <li><a href="./vendas.html">Vendas</a></li>
                <li><a href="./sobre.html">Sobre o Projeto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card">
            <table id="table-compras"></table>

            <div class="add-compra">
                <input type="date" name="dia" id="dia">
                <input type="number" name="produto" id="produto_id" placeholder="ID do Produto">
                <input type="number" name="preco" id="preco" placeholder="Preço de Custo (R$)">
                <input type="number" name="qtd" id="qtd" placeholder="Quantidade">
                <input type="text" name="fornecedor" id="fornecedor" placeholder="Nome do Fornecedor">

                <input type="button" value="Adicionar Compra" id="but-add-compra" onclick="add_compra()">
                <div id="update-delete-compra">
                    <input type="button" value="Alterar" onclick="upt_compra()">
                    <input type="button" value="Deletar" onclick="del_compra()">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <h2>Desenvolvido por dmrodrigues-dev</h2>
        <ul>
            <li><a href="#">GitHub</a></li>
            <li><a href="#">LinkedIn</a></li>
            <li><a href="#">E-mail</a></li>
        </ul>
    </footer>

    <script src="javascript/compras.js"></script>
</body>

</html>
