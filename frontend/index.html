<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agropanel - Dashboard</title>
    <script src="/frontend/javascript/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>

<body>
    <header>
        <h1>AGROPANEL</h1>
        <nav>
            <ul>
                <li><a href="./compras.html">Compras</a></li>
                <li><a href="./vendas.html">Vendas</a></li>
                <li><a href="./sobre.html">Sobre o Projeto</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-home">
        <aside class="aside">
            <table id="table-produtos"></table>

            <div id="add-produto">
                <input type="text" name="nome" id="nome" placeholder="Nome do Produto">
                <input type="number" name="valor" id="preco" placeholder="Preço de Venda (R$)">

                <input type="button" value="Adicionar Produto" id="but-add-produto" onclick="add_produto()">
                <div id="update-delete-produto">
                    <input type="button" value="Alterar" onclick="upt_produto()">
                    <input type="button" value="Deletar" onclick="del_produto()">
                </div>
            </div>
        </aside>

        <section class="dashboards">
            <input type="month" name="mes" id="mes">
            <canvas id="chart"></canvas>
            <section class="statistic-cards">
                <div id="receita" class="small-card"></div>
                <div id="despesa" class="small-card"></div>
                <div id="lucro" class="small-card"></div>
            </section>
        </section>
    </main>

    <footer>
        <h2>Desenvolvido por dmrodrigues-dev</h2>
        <ul>
            <li><a href="#">GitHub</a></li>
            <li><a href="#">LinkedIn</a></li>
            <li><a href="#">E-mail</a></li>
        </ul>
    </footer>

    <script src="javascript/index.js"></script>
</body>

</html>
